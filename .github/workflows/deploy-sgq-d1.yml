name: Deploy Danuta SGQ D1 API

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/sgq-api/**"
      - ".github/workflows/deploy-sgq-d1.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/sgq-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install


      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: npx wrangler d1 execute danuta-sgq --remote --file=./schema.sql

      - name: Ensure workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: |
          set -e
          STATUS=$(curl -sS -o /tmp/cf-subdomain.json -w "%{http_code}" \
            -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"subdomain":"galvanicadanuta1"}')
          cat /tmp/cf-subdomain.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            echo "Falha ao configurar workers.dev (HTTP $STATUS)."
            exit 1
          fi

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: npx wrangler deploy

      - name: Verify Worker health
        run: |
          set -e
          BODY=$(curl -fsS --retry 5 --retry-delay 2 \
            "https://danuta-sgq-api.galvanicadanuta1.workers.dev/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"d1":true'
