name: Deploy Danuta SGQ D1 API

on:
  workflow_dispatch:
  push:
    paths:
      - "cloudflare/sgq-api/**"
      - ".github/workflows/deploy-sgq-d1.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/sgq-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Wrangler
        run: npm install


      - name: Apply D1 schema
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: npx wrangler d1 execute danuta-sgq --remote --file=./schema.sql

      - name: Resolve workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: |
          set -e
          STATUS=$(curl -sS -o /tmp/cf-subdomain.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          cat /tmp/cf-subdomain.json

          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 300 ]; then
            SUBDOMAIN=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/cf-subdomain.json','utf8')); process.stdout.write((x.result&&x.result.subdomain)||'')")
          else
            SUBDOMAIN=""
          fi

          if [ -z "$SUBDOMAIN" ]; then
            STATUS=$(curl -sS -o /tmp/cf-subdomain-create.json -w "%{http_code}" \
              -X PUT \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"subdomain":"galvanicadanuta1"}')
            cat /tmp/cf-subdomain-create.json
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              echo "Falha ao configurar workers.dev (HTTP $STATUS)."
              exit 1
            fi
            SUBDOMAIN=$(node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync('/tmp/cf-subdomain-create.json','utf8')); process.stdout.write((x.result&&x.result.subdomain)||'galvanicadanuta1')")
          fi

          echo "Workers subdomain: $SUBDOMAIN"
          echo "WORKERS_DEV_SUBDOMAIN=$SUBDOMAIN" >> "$GITHUB_ENV"

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: npx wrangler deploy

      - name: Verify Worker health
        run: |
          set -e
          BODY=$(curl -fsS --retry 5 --retry-delay 2 \
            "https://danuta-sgq-api.$WORKERS_DEV_SUBDOMAIN.workers.dev/health")
          echo "$BODY"
          echo "$BODY" | grep -q '"ok":true'
          echo "$BODY" | grep -q '"d1":true'

      - name: Verify Apps Script D1 mirror
        run: |
          set -e
          APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbwBimN8eXQFB3CkV-xv557oOiHjC8Htce9yUAiKjJhayao7-WXyxjOaiNHqm7NX4P3G8Q/exec"
          STATUS=$(curl -sS -L -o /tmp/apps-script-health.json -w "%{http_code}" \
            -X POST "$APPS_SCRIPT_URL" \
            -H "Content-Type: application/json" \
            --data '{"method":"healthCheck","args":[]}')
          echo "Apps Script HTTP $STATUS"
          cat /tmp/apps-script-health.json
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
            exit 1
          fi
          grep -q '"api":"SGQ_FIXPAR_V3"' /tmp/apps-script-health.json
          grep -q '"d1Mirror":true' /tmp/apps-script-health.json
          grep -q '"d1SyncConfigured":true' /tmp/apps-script-health.json

      - name: Smoke test D1 read endpoints
        run: |
          set -e
          BASE="https://danuta-sgq-api.$WORKERS_DEV_SUBDOMAIN.workers.dev"

          check_endpoint() {
            NAME="$1"
            URL="$2"
            STATUS=$(curl -sS -o "/tmp/$NAME.json" -w "%{http_code}" "$URL")
            echo "$NAME HTTP $STATUS"
            if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 300 ]; then
              cat "/tmp/$NAME.json"
              exit 1
            fi
            grep -q '"ok":true' "/tmp/$NAME.json"
          }

          check_endpoint records "$BASE/api/records?client=FIXPAR&dataset=RECEBIMENTO&limit=2"
          check_endpoint history "$BASE/api/history?client=FIXPAR&dataset=RECEBIMENTO&start=2026-10-01&end=2026-10-31&limit=2"
          check_endpoint programacao "$BASE/api/programacao?client=FIXPAR"

      - name: Show D1 mirror counts
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "f18eaea1c83abc8958146975896817c7"
        run: |
          npx wrangler d1 execute danuta-sgq --remote --command="SELECT dataset, COUNT(*) AS total FROM operational_records WHERE client_key='FIXPAR' AND deleted=0 GROUP BY dataset; SELECT COUNT(*) AS programacao FROM program_states WHERE client_key='FIXPAR';"
